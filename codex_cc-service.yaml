# Codex CLI NodePort Service: exposes codex-cc-dev pod ports externally
# Template file: uses ${AI_K8S_HOME} placeholder
# Deploy via codex_cc-deploy.sh (NOT directly with kubectl apply)
#
# Port mapping (within 30000-32767 range, avoids cc 30xxx and oc 31xxx):
#   5432 (PostgreSQL)  -> NodePort 32543
#   5173 (Vite dev)    -> NodePort 32517
#   8000 (HTTP)        -> NodePort 32700
#   8080 (HTTP alt)    -> NodePort 32080
#   80  (HTTP)         -> NodePort 32000
#   443 (HTTPS)        -> NodePort 32443
apiVersion: v1
kind: Service
metadata:
  name: codex-cc-dev-service
  namespace: ai
spec:
  type: NodePort
  selector:
    app: codex-cc-dev
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    nodePort: 32543
  - name: vite
    port: 5173
    targetPort: 5173
    nodePort: 32517
  - name: http-8000
    port: 8000
    targetPort: 8000
    nodePort: 32700
  - name: http-8080
    port: 8080
    targetPort: 8080
    nodePort: 32080
  - name: http
    port: 80
    targetPort: 80
    nodePort: 32000
  - name: https
    port: 443
    targetPort: 443
    nodePort: 32443

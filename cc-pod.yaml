# Claude Code isolated execution environment pod
# Template file: uses ${AI_K8S_HOME} and ${ANTHROPIC_AUTH_TOKEN} placeholders
# Deploy via cc-deploy.sh (NOT directly with kubectl apply)
apiVersion: v1
kind: Pod
metadata:
  name: cc-dev
  namespace: ai
spec:
  containers:
  - name: cc-dev
    image: cc-dev:1.0.1
    env:
    - name: ANTHROPIC_AUTH_TOKEN
      value: "${ANTHROPIC_AUTH_TOKEN}"
    - name: ANTHROPIC_DEFAULT_SONNET_MODEL
      value: "${CC_SONNET_MODEL}"
    - name: ANTHROPIC_DEFAULT_OPUS_MODEL
      value: "${CC_OPUS_MODEL}"
    - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
      value: "${CC_HAIKU_MODEL}"
    # Mount Claude Code data directory from host cc-cache/claude/
    volumeMounts:
    - name: cc-data
      mountPath: /home/postgres/.claude
    # Working directory for Claude Code to operate on source code
    - name: k8s-work
      mountPath: /home/postgres/work
  # ${AI_K8S_HOME} is substituted at deploy time by cc-deploy.sh (envsubst)
  # Defaults to the project root directory (where cc-deploy.sh lives)
  volumes:
  - name: cc-data
    hostPath:
      path: ${AI_K8S_HOME}/cc-cache/claude
      type: DirectoryOrCreate
  - name: k8s-work
    hostPath:
      path: ${AI_K8S_HOME}/k8s-work
      type: DirectoryOrCreate

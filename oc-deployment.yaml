# OpenCode Deployment: manages multiple pod replicas for parallel execution
# Template file: uses ${AI_K8S_HOME} placeholder for host paths
# Deploy via deploy-deployment.sh (NOT directly with kubectl apply)
#
# Note: all replicas share the same hostPath volumes (oc-cache, k8s-work).
# If isolated storage per pod is needed, use PVC with StatefulSet instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oc-dev-deployment
  namespace: ai
spec:
  replicas: ${OC_REPLICAS}
  selector:
    matchLabels:
      app: oc-dev
  template:
    metadata:
      labels:
        app: oc-dev
    spec:
      containers:
      - name: oc-dev
        image: oc-dev:1.0.1
        env:
        - name: POSTGRES_PASSWORD
          value: "secret"
        # Mount OpenCode config/state/share/cache from host oc-cache/ subdirectories
        # via subPath on a single volume (oc-base)
        volumeMounts:
        - name: oc-base
          mountPath: /home/postgres/.config/opencode
          subPath: config
        - name: oc-base
          mountPath: /home/postgres/.local/state/opencode
          subPath: state
        - name: oc-base
          mountPath: /home/postgres/.local/share/opencode
          subPath: share
        - name: oc-base
          mountPath: /home/postgres/.cache/opencode
          subPath: cache
        # Working directory for OpenCode to operate on source code
        - name: k8s-work
          mountPath: /home/postgres/work
      # ${AI_K8S_HOME} is substituted at deploy time by deploy-deployment.sh (envsubst)
      # Defaults to the project root directory (where the script lives)
      volumes:
      - name: oc-base
        hostPath:
          path: ${AI_K8S_HOME}/oc-cache
          type: DirectoryOrCreate
      - name: k8s-work
        hostPath:
          path: ${AI_K8S_HOME}/k8s-work
          type: DirectoryOrCreate

# OpenCode NodePort Service: exposes oc-dev pod ports externally
# Template file: uses ${AI_K8S_HOME} placeholder
# Deploy via oc-deploy.sh (NOT directly with kubectl apply)
#
# Port mapping (NodePorts offset by +1000 vs cc-service to avoid conflict):
#   5432 (PostgreSQL)  -> NodePort 31543
#   5173 (Vite dev)    -> NodePort 31517
#   8000 (HTTP)        -> NodePort 31800
#   8080 (HTTP alt)    -> NodePort 31080
#   80  (HTTP)         -> NodePort 31000
#   443 (HTTPS)        -> NodePort 31443
apiVersion: v1
kind: Service
metadata:
  name: oc-dev-service
  namespace: ai
spec:
  type: NodePort
  selector:
    app: oc-dev
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    nodePort: 31543
  - name: vite
    port: 5173
    targetPort: 5173
    nodePort: 31517
  - name: http-8000
    port: 8000
    targetPort: 8000
    nodePort: 31800
  - name: http-8080
    port: 8080
    targetPort: 8080
    nodePort: 31080
  - name: http
    port: 80
    targetPort: 80
    nodePort: 31000
  - name: https
    port: 443
    targetPort: 443
    nodePort: 31443

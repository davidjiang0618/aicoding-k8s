# Codex CLI + CCX sidecar Deployment: manages multiple pod replicas for parallel execution
# Template file: uses ${AI_K8S_HOME}, ${CODEX_API_KEY}, ${CODEX_REPLICAS} placeholders
# Deploy via codex-deploy-deployment.sh (NOT directly with kubectl apply)
#
# Architecture:
#   Codex CLI → localhost:3000 (CCX) → Responses→Chat conversion → Zhipu GLM
#
# Note: all replicas share the same hostPath volumes (codex-cache, k8s-work).
# If isolated storage per pod is needed, use PVC with StatefulSet instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-dev-deployment
  namespace: ai
spec:
  replicas: ${CODEX_REPLICAS}
  selector:
    matchLabels:
      app: codex-dev
  template:
    metadata:
      labels:
        app: codex-dev
    spec:
      containers:
      - name: codex-dev
        image: codex-dev:1.0.1
        env:
        - name: CODEX_API_KEY
          value: "${CODEX_API_KEY}"
        - name: CODEX_MODEL
          value: "${CODEX_MODEL}"
        # Mount Codex config directory from host codex-cache/codex/
        volumeMounts:
        - name: codex-data
          mountPath: /home/postgres/.codex
        # Working directory for Codex to operate on source code
        - name: k8s-work
          mountPath: /home/postgres/work
      # CCX sidecar: protocol translation gateway (Responses API → Chat Completions)
      # Configured once via Web UI after first deploy (port-forward :3000)
      - name: ccx
        image: crpi-i19l8zl0ugidq97v.cn-hangzhou.personal.cr.aliyuncs.com/bene/ccx:latest
        ports:
        - containerPort: 3000
        env:
        - name: PROXY_ACCESS_KEY
          value: "${CODEX_API_KEY}"
        - name: PORT
          value: "3000"
        - name: ENABLE_WEB_UI
          value: "false"
        - name: REQUEST_TIMEOUT
          value: "300000"
        volumeMounts:
        - name: ccx-data
          mountPath: /app/.config
      # ${AI_K8S_HOME} is substituted at deploy time by codex-deploy-deployment.sh (envsubst)
      # Defaults to the project root directory (where the script lives)
      volumes:
      - name: codex-data
        hostPath:
          path: ${AI_K8S_HOME}/codex-cache/codex
          type: DirectoryOrCreate
      - name: ccx-data
        hostPath:
          path: ${AI_K8S_HOME}/codex-cache/ccx
          type: DirectoryOrCreate
      - name: k8s-work
        hostPath:
          path: ${AI_K8S_HOME}/k8s-work
          type: DirectoryOrCreate
